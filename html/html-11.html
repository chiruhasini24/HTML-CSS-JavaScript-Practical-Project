<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            text-align: center;
            font-family: Arial;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Internal and External CSS</h1>

    <p>
        This paragraph is styled using internal CSS.
    </p>

    <button class="btn">Click Me</button>

</body>
</html>
style.css
body {
    background-color: lightgray;
}

.btn {
    background-color: blue;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
}
