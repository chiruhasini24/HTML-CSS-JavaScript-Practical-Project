<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Program 03</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f7fb;
        }

        header {
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
        }

        .color-box {
            color: white;
            background-color: #2563eb;
            padding: 20px;
            margin: 15px 0;
            border: 3px solid #1e3a8a;
            border-radius: 8px;
        }

        .background-box {
            padding: 20px;
            margin: 15px 0;
            background-color: #dbeafe;
            border: 2px dashed #2563eb;
        }

        .border-box {
            padding: 20px;
            margin: 15px 0;
            border: 4px solid #dc2626;
            border-radius: 12px;
        }

        .navigation {
            margin-top: 25px;
        }

        a {
            text-decoration: none;
            background-color: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            margin-right: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <header>
        <h1>CSS Program 03</h1>
        <p>Colors, Backgrounds and Borders</p>
    </header>

    </main>

        HTML & CSS & JavaScript Practical Programs
    </footer>

</body>
</html>
