```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index and Stacking</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        h1 {
            text-align: center;
            color: #12355b;
            margin: 30px;
        }

        .container {
            width: 500px;
            max-width: 90%;
            height: 350px;
            margin: 40px auto;
            position: relative;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        .box {
            width: 180px;
            height: 150px;
            position: absolute;
            padding: 20px;
            color: white;
            font-weight: bold;
            border-radius: 10px;
        }

        .box1 {
            background: #12355b;
            left: 50px;
            top: 50px;
            z-index: 1;
        }

        .box2 {
            background: #2563a6;
            left: 150px;
            top: 100px;
            z-index: 2;
        }

        .box3 {
            background: #5b8db8;
            left: 250px;
            top: 150px;
            z-index: 3;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        .navigation a {
            text-decoration: none;
            background: #12355b;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <h1>Z-Index and Stacking</h1>

    <div class="container">

        <div class="box box1">
            Box 1<br>
            z-index: 1
        </div>

        <div class="box box2">
            Box 2<br>
            z-index: 2
        </div>

        <div class="box box3">
            Box 3<br>
            z-index: 3
        </div>

    </div>

    <div class="navigation">
        <a href="index.html">Back to CSS Programs</a>
        <a href="../index.html">Home</a>
        <a href="css-37.html">Next Program</a>
    </div>

</body>
</html>
