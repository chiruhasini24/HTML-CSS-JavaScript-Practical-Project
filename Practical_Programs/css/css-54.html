```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 54 - Responsive Contact Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .nav {
            background: white;
            padding: 15px 25px;
        }

        .nav a {
            text-decoration: none;
            color: #2563eb;
            margin-right: 15px;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .contact-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #0f172a;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .contact-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="nav">
        <a href="index.html">← CSS Programs</a>
        <a href="../index.html">Home</a>
        <a href="css-55.html">Next →</a>
    </div>

    <div class="container">

        <div class="contact-box">

            <h1>Contact Us</h1>

            <form>

                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="Enter subject">

                <label for="message">Message</label>
                <textarea id="message" placeholder="Write your message"></textarea>

                <button type="submit">Send Message</button>

            </form>

        </div>

    </div>

</body>
</html>
```
