<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Program 14</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f7fb;
        }

        header {
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
        }

        .flex-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
            background-color: #eff6ff;
            border: 2px solid #bfdbfe;
        }

        .box {
            flex: 1;
            min-width: 180px;
            padding: 40px 20px;
            background-color: #2563eb;
            color: white;
            text-align: center;
            border-radius: 8px;
        }

        .navigation {
            margin-top: 25px;
        }

        .navigation a {
            text-decoration: none;
            background-color: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            margin-right: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .flex-container {
                flex-direction: column;
            }

            .box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Program 14</h1>
    <p>Flexbox Layout</p>
</header>

<main class="container">

    <h2>Flexbox Demonstration</h2>

    <p>
        Flexbox is used to arrange elements in rows or columns
        and control their alignment and spacing.
    </p>

    <div class="flex-container">

        <div class="box">
            Box 1
        </div>

        <div class="box">
            Box 2
        </div>

        <div class="box">
            Box 3
        </div>

    </div>

    </div>

</main>

</footer>

</body>
</html>
