<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Hover Effect</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        h1 {
            text-align: center;
            color: #12355b;
            margin: 30px;
        }

        .gallery {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .image-box {
            width: 280px;
            height: 200px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s, filter 0.5s;
        }

        .image-box:hover img {
            transform: scale(1.15);
            filter: brightness(0.7);
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        .navigation a {
            text-decoration: none;
            background: #12355b;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }

        @media (max-width: 600px) {
            .image-box {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>

<body>

    <h1>Image Hover Effect</h1>

    <div class="gallery">

        <div class="image-box">
            <img src="https://picsum.photos/500/350?random=10"
                 alt="Image 1">
        </div>

        <div class="image-box">
            <img src="https://picsum.photos/500/350?random=11"
                 alt="Image 2">
        </div>

        <div class="image-box">
            <img src="https://picsum.photos/500/350?random=12"
                 alt="Image 3">
        </div>

    </div>

    <div class="navigation">
        <a href="index.html">Back to CSS Programs</a>
        <a href="../index.html">Home</a>
        <a href="css-41.html">Next Program</a>
    </div>

</body>
</html>
