<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Hover Animation</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
        }

        h1 {
            color: #12355b;
            margin-top: 80px;
        }

        .button {
            position: relative;
            display: inline-block;
            margin-top: 40px;
            padding: 15px 35px;
            background: #12355b;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            overflow: hidden;
            transition: background 0.3s, transform 0.3s;
        }

        .button::before {
            content: "";
            position: absolute;
            width: 0;
            height: 100%;
            top: 0;
            left: 0;
            background: #2563a6;
            transition: width 0.4s;
            z-index: 0;
        }

        .button span {
            position: relative;
            z-index: 1;
        }

        .button:hover::before {
            width: 100%;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .navigation {
            margin: 80px 30px 30px;
        }

        .navigation a {
            text-decoration: none;
            background: #12355b;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <h1>CSS-only Button Hover Animation</h1>

    <a href="#" class="button">
        <span>Hover Over Me</span>
    </a>

        <a href="css-43.html">Next Program</a>
    </div>

</body>
</html>
