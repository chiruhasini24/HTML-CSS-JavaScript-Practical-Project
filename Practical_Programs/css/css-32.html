<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Effects</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        h1 {
            text-align: center;
            color: #12355b;
            text-shadow: 2px 2px 4px #aaa;
            margin: 35px;
        }

        .card {
            width: 350px;
            max-width: 90%;
            margin: 40px auto;
            padding: 30px;
            background: white;
            text-align: center;
            border-radius: 10px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #2563a6;
            text-shadow: 2px 2px 3px #bbb;
        }

        .card p {
            line-height: 1.6;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        .navigation a {
            text-decoration: none;
            background: #12355b;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <h1>CSS Shadow Effects</h1>

    <div class="card">

        <h2>Box Shadow</h2>

        <p>
            This card demonstrates the CSS
            <strong>box-shadow</strong> property.
        </p>

        <p>
            The heading demonstrates the
            <strong>text-shadow</strong> property.
        </p>

    </div>

    <div class="navigation">
        <a href="index.html">Back to CSS Programs</a>
        <a href="../index.html">Home</a>
        <a href="css-33.html">Next Program</a>
    </div>

</body>
</html>
