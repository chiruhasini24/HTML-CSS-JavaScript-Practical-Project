```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 72 - Responsive Typography</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .nav {
            background: white;
            padding: 15px 25px;
        }

        .nav a {
            color: #2563eb;
            text-decoration: none;
            margin-right: 15px;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .content {
            background: white;
            padding: 35px;
            border-radius: 10px;
            text-align: center;
        }

        h1 {
            font-size: 8vw;
            color: #1e3a8a;
        }

        h2 {
            font-size: 5vw;
        }

        p {
            font-size: 2vw;
            line-height: 1.7;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 12vw;
            }

            h2 {
                font-size: 8vw;
            }

            p {
                font-size: 5vw;
            }
        }

        @media (min-width: 1000px) {

            h1 {
                font-size: 70px;
            }

            h2 {
                font-size: 40px;
            }

            p {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="nav">
        <a href="index.html">← CSS Programs</a>
        <a href="../index.html">Home</a>
        <a href="css-73.html">Next →</a>
    </div>

    <div class="container">

        <div class="content">

            <h1>Responsive Typography</h1>

            <h2>Resize the Browser</h2>

            <p>
                The font sizes in this webpage automatically adjust
                according to the screen width.
            </p>

        </div>

    </div>

</body>
</html>
```
