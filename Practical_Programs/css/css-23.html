```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            text-align: center;
        }

        h1 {
            color: #12355b;
        }

        .product-card {
            width: 300px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h2 {
            color: #12355b;
        }

        .price {
            color: #2563a6;
            font-size: 24px;
            font-weight: bold;
        }

        .description {
            color: #666;
            line-height: 1.5;
        }

        .buy-button {
            display: inline-block;
            background: #12355b;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }

        .buy-button:hover {
            background: #2563a6;
        }

        .navigation {
            text-align: center;
            margin: 25px;
        }

        .navigation a {
            text-decoration: none;
            background: #12355b;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Product Card</h1>

        <div class="product-card">

            <img src="https://via.placeholder.com/300x220" alt="Laptop">

            <div class="product-info">
                <h2>Student Laptop</h2>

                <p class="price">₹45,999</p>

                <p class="description">
                    Powerful and lightweight laptop suitable for
                    students, programming and everyday work.
                </p>

                <a href="#" class="buy-button">Buy Now</a>
            </div>

        </div>

    </div>

    <div class="navigation">
        <a href="index.html">Back to CSS Programs</a>
        <a href="../index.html">Home</a>
        <a href="css-24.html">Next Program</a>
    </div>

</body>
</html>
```
