<!DOCTYPE html>
<html>
<head>
    <title>CSS Properties</title>

    <style>

        /* Element Selector */
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        /* ID Selector */
        #heading {
            color: blue;
            text-align: center;
        }

        /* Class Selector */
        .box {
            background-color: white;
            color: black;
            font-size: 18px;

            margin: 30px;
            padding: 20px;

            border: 3px solid black;
        }

        /* Group Selector */
        h2, p {
            font-family: Georgia;
        }

    </style>
</head>

<body>

    <h1 id="heading">CSS Selectors</h1>

    <div class="box">
        <h2>CSS Properties</h2>

        <p>
            This webpage demonstrates selectors,
            colors, fonts, margins, padding and borders.
        </p>
    </div>

</body>
</html>
