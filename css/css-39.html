```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Dropdown Menu</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #12355b;
            padding: 15px 30px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            display: inline-block;
        }

        .navbar a:hover {
            background: #2563a6;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-button {
            color: white;
            padding: 15px 20px;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 180px;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .dropdown-content a {
            color: #222;
            display: block;
            text-align: left;
            padding: 12px 15px;
        }

        .dropdown-content a:hover {
            background: #eaf1f8;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .content {
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
            text-align: center;
            background: white;
            border-radius: 10px;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        .navigation a {
            text-decoration: none;
            background: #12355b;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <a href="#">Home</a>

        <div class="dropdown">

            <span class="dropdown-button">Courses ▼</span>

            <div class="dropdown-content">
                <a href="#">HTML</a>
                <a href="#">CSS</a>
                <a href="#">JavaScript</a>
            </div>

        </div>

        <a href="#">About</a>
        <a href="#">Contact</a>

    </div>

    <div class="content">

        <h1>CSS Dropdown Menu</h1>

        <p>
            Move the mouse over <strong>Courses</strong>
            to display the dropdown menu.
        </p>

    </div>

    <div class="navigation">
        <a href="index.html">Back to CSS Programs</a>
        <a href="../index.html">Home</a>
        <a href="css-40.html">Next Program</a>
    </div>

</body>
</html>
