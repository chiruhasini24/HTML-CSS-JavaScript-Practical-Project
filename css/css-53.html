```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 53 - Responsive Login and Signup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef4ff;
        }

        .nav {
            background: white;
            padding: 15px 25px;
        }

        .nav a {
            text-decoration: none;
            color: #2563eb;
            margin-right: 15px;
        }

        .container {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .form-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #0f172a;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
        }

        .signup a {
            color: #2563eb;
        }

        @media (max-width: 500px) {
            .container {
                padding: 15px;
            }

            .form-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="nav">
        <a href="index.html">← CSS Programs</a>
        <a href="../index.html">Home</a>
        <a href="css-54.html">Next →</a>
    </div>

    <div class="container">

        <div class="form-box">

            <h1>Login</h1>

            <form>
                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Password</label>
                <input type="password" placeholder="Enter your password">

                <button type="submit">Login</button>
            </form>

            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>

        </div>

    </div>

</body>
</html>
```
