<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        h1 {
            text-align: center;
            color: #12355b;
            margin: 30px;
        }

        .gallery {
            width: 90%;
            max-width: 1000px;
            margin: auto;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .item {
            width: 200px;
            text-align: center;
        }

        .item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .blur img {
            filter: blur(3px);
        }

        .grayscale img {
            filter: grayscale(100%);
        }

        .brightness img {
            filter: brightness(1.5);
        }

        .contrast img {
            filter: contrast(180%);
        }

        .item h3 {
            color: #12355b;
        }

        .navigation {
            text-align: center;
            margin: 40px 30px 30px;
        }

        .navigation a {
            text-decoration: none;
            background: #12355b;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <h1>CSS Image Filters</h1>

    <div class="gallery">

        <div class="item blur">
            <img src="https://picsum.photos/400/300?random=20" alt="Blur">
            <h3>Blur</h3>
        </div>

        <div class="item grayscale">
            <img src="https://picsum.photos/400/300?random=21" alt="Grayscale">
            <h3>Grayscale</h3>
        </div>

        <div class="item brightness">
            <img src="https://picsum.photos/400/300?random=22" alt="Brightness">
            <h3>Brightness</h3>
        </div>

        <div class="item contrast">
            <img src="https://picsum.photos/400/300?random=23" alt="Contrast">
            <h3>Contrast</h3>
        </div>

    </div>

    <div class="navigation">
        <a href="index.html">Back to CSS Programs</a>
        <a href="../index.html">Home</a>
        <a href="css-44.html">Next Program</a>
    </div>

</body>
</html>
