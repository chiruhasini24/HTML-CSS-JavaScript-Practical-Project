<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradients</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        h1 {
            text-align: center;
            color: #12355b;
            margin: 30px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        .box {
            height: 180px;
            margin: 25px 0;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .linear {
            background: linear-gradient(to right, #12355b, #2563a6);
        }

        .radial {
            background: radial-gradient(circle, #2563a6, #12355b);
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        .navigation a {
            text-decoration: none;
            background: #12355b;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <h1>CSS Gradients</h1>

    <div class="container">

        <div class="box linear">
            Linear Gradient
        </div>

        <div class="box radial">
            Radial Gradient
        </div>

    </div>
