<head>
    <meta charset="UTF-8">

    <title>CSS Program 12</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f7fb;
        }

        header {
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
        }

        /* List styling */
        .skills {
            list-style-type: square;
            padding: 20px;
            background-color: #eff6ff;
        }

        .skills li {
            margin: 10px;
            color: #1e40af;
        }

        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #94a3b8;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f1f5f9;
        }

        tr:hover {
            background-color: #dbeafe;
        }

        .navigation {
            margin-top: 25px;
        }

        .navigation a {
            text-decoration: none;
            background-color: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            margin-right: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
    </style>
</head>
