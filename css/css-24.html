```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        h1 {
            text-align: center;
            color: #12355b;
            margin: 30px;
        }

        .gallery {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        .navigation a {
            text-decoration: none;
            background: #12355b;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Photo Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/500/300?random=1" alt="Gallery Image 1">
        <img src="https://picsum.photos/500/300?random=2" alt="Gallery Image 2">
        <img src="https://picsum.photos/500/300?random=3" alt="Gallery Image 3">
        <img src="https://picsum.photos/500/300?random=4" alt="Gallery Image 4">
        <img src="https://picsum.photos/500/300?random=5" alt="Gallery Image 5">
        <img src="https://picsum.photos/500/300?random=6" alt="Gallery Image 6">

    </div>

    <div class="navigation">
        <a href="index.html">Back to CSS Programs</a>
        <a href="../index.html">Home</a>
        <a href="css-25.html">Next Program</a>
    </div>

</body>
</html>
