<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity and Transparency</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        h1 {
            text-align: center;
            color: #12355b;
            margin: 30px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        .box {
            height: 130px;
            margin: 20px 0;
            padding: 30px;
            color: white;
            background: #2563a6;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
        }

        .full {
            opacity: 1;
        }

        .medium {
            opacity: 0.6;
        }

        .low {
            opacity: 0.3;
        }

        .transparent {
            background: rgba(18, 53, 91, 0.5);
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        .navigation a {
            text-decoration: none;
            background: #12355b;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <h1>Opacity and Transparency</h1>

    <div class="container">

        <div class="box full">
            Opacity: 1
        </div>

        <div class="box medium">
            Opacity: 0.6
        </div>

        <div class="box low">
            Opacity: 0.3
        </div>

        <div class="box transparent">
            Transparent Background using RGBA
        </div>

    </div>

</body>
</html>
