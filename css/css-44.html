<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Fit and Position</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        h1 {
            text-align: center;
            color: #12355b;
            margin: 30px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 260px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            width: 230px;
            height: 180px;
            border-radius: 8px;
        }

        .cover {
            object-fit: cover;
        }

        .contain {
            object-fit: contain;
            background: #eaf1f8;
        }

        .position {
            object-fit: cover;
            object-position: right center;
        }

        .card h3 {
            color: #12355b;
        }

        .navigation {
            text-align: center;
            margin: 40px 30px 30px;
        }

        .navigation a {
            text-decoration: none;
            background: #12355b;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }

        @media (max-width: 600px) {
            .card {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <h1>Object-fit and Object-position</h1>

    <div class="container">

        <div class="card">
            <img class="cover"
                 src="https://picsum.photos/500/300?random=30"
                 alt="Cover Example">

            <h3>object-fit: cover</h3>
        </div>

        <div class="card">
            <img class="contain"
                 src="https://picsum.photos/500/300?random=31"
                 alt="Contain Example">

            <h3>object-fit: contain</h3>
        </div>

        <div class="card">
            <img class="position"
                 src="https://picsum.photos/500/300?random=32"
                 alt="Position Example">

            <h3>object-position: right</h3>
        </div>

    </div>

    <div class="navigation">
        <a href="index.html">Back to CSS Programs</a>
        <a href="../index.html">Home</a>
        <a href="css-45.html">Next Program</a>
    </div>

</body>
</html>
```
