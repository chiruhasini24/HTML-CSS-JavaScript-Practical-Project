<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Program 09</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f7fb;
        }

        header {
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background-color: #1e293b;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 18px 25px;
            display: block;
        }

        nav a:hover {
            background-color: #2563eb;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            text-align: center;
        }

        .navigation {
            margin-top: 25px;
        }

        .navigation a {
            text-decoration: none;
            background-color: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            margin-right: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Program 09</h1>
    <p>Styled Navigation Bar</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Gallery</a>
    <a href="#">Contact</a>
</nav>

<main class="container">

    <h2>Navigation Bar</h2>

    <p>
        This example demonstrates a horizontal navigation bar
        using CSS.
    </p>

    <div class="navigation">
        <a href="index.html">Back to CSS Programs</a>
        <a href="../index.html">Home</a>
        <a href="css-10.html">Next Program →</a>
    </div>

</main>

<footer>
    HTML & CSS & JavaScript Practical Programs
</footer>

</body>
</html>
