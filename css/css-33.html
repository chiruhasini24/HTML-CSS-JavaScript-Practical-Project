<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Radius Shapes</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        h1 {
            text-align: center;
            color: #12355b;
            margin: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .shape {
            width: 150px;
            height: 150px;
            background: #2563a6;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }

        .rounded {
            border-radius: 20px;
        }

        .circle {
            border-radius: 50%;
        }

        .pill {
            width: 220px;
            border-radius: 75px;
        }

        .custom {
            border-radius: 10px 40px 70px 100px;
        }

        .navigation {
            text-align: center;
            margin: 30px;
        }

        .navigation a {
            text-decoration: none;
            background: #12355b;
            color: white;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <h1>Border Radius Shapes</h1>

    <div class="container">

        <div class="shape rounded">
            Rounded
        </div>

        <div class="shape circle">
            Circle
        </div>

        <div class="shape pill">
            Pill
        </div>

        <div class="shape custom">
            Custom
        </div>

    </div>

</body>
</html>
